[kalshi]
# "demo" → demo-api.kalshi.co (paper-trade), "prod" → trading-api.kalshi.com.
# Read from KALSHI_ENV env var if set; this is the default fallback.
env = "demo"

[execution]
# "dry_run" → log decisions only (no orders, no risk).
# "paper"   → same code path as live, routed through paper-trade endpoint
#             or local mock. Surfaces lifecycle bugs dry-run can't catch.
# "live"    → real money. Requires KALSHI_API_KEY_ID + KALSHI_PRIVATE_KEY_PATH
#             AND KALSHI_ENV=prod AND an explicit code-edit to the executor's
#             never_send flag. Default keeps you safe.
mode = "dry_run"

[forecast]
# NOAA NWS API base. Public endpoint, no auth, but they ask for a User-Agent.
nws_base_url = "https://api.weather.gov"
# Identifier sent in the User-Agent. NWS blocks generic UAs.
user_agent = "Kalshi-Weather-Bot (set-your-contact@example.com)"
# How often to refresh forecasts (seconds).
refresh_interval_secs = 1800
# Lockout window after a fresh NWS forecast issue (seconds). Arb bots
# reprice within seconds of an NWS update; sitting out the first 30 min
# avoids being adversely selected. The clock is the NWS-published
# `generatedAt`, not our local fetch time. Set to 0 to disable.
nws_lockout_after_update_secs = 1800
# Use GEFS ensemble σ (Open-Meteo, 30 perturbed members) in pricing
# instead of the hand-calibrated sigma_for_horizon table. Static table is
# kept as a fallback for any (city, date, stat) without enough live
# members, so flipping this on is safe. Default true.
gefs_sigma_enabled = true
# GEFS refresh cadence (seconds). GEFS publishes new runs every ~6h;
# 1800 = 30 min gives us at most one stale window per run.
gefs_refresh_interval_secs = 1800
# Use ECMWF IFS-0.25° ensemble (Open-Meteo, 50 perturbed members)
# alongside GEFS. When both are enabled, per-member daily extremes from
# both sources are pooled into a blended (μ, σ); the JSONL stamps
# sigma_source = "gefs_ecmwf_blend" so backtests can split metrics by
# source. Static table remains the fallback whenever both ensembles are
# unavailable for a market.
ecmwf_sigma_enabled = true
ecmwf_refresh_interval_secs = 1800
# Intraday "lock" pricing — when a settlement-day market's running
# daily-high (or daily-low) already crossed the strike, override the
# model probability to ~0.99 and stamp sigma_source = "metar_lock".
# Lock is monotone: once a valid in-window observation crosses the
# strike, CLI will report YES regardless of what the rest of the day
# does. Refresh cadence matches the api.weather.gov edge cache.
intraday_lock_enabled = true
metar_refresh_interval_secs = 300

[scanner]
# How often to refresh the Kalshi market list (seconds).
refresh_interval_secs = 300
# Full Kalshi series tickers to track. Kalshi's `?series_ticker=` filter
# requires the exact series, not a prefix, so we list each city × stat
# combo we care about. Add more cities as v1 expands.
series_tickers = [
    "KXHIGHNY", "KXLOWNY",
    "KXHIGHCHI", "KXLOWCHI",
    "KXHIGHLAX", "KXLOWLAX",
    "KXHIGHMIA", "KXLOWMIA",
    "KXHIGHAUS", "KXLOWAUS",
]

[strategy]
# Minimum edge (model probability − market price) to take a position. 5¢ default.
min_edge = "0.05"
# Kelly fraction multiplier. 0.25 = "quarter Kelly" — conservative.
kelly_fraction = "0.25"
# Extra margin (dollars per contract) the EV gate requires on top of fees.
safety_buffer = "0.01"
# Per-series Kalshi fee multiplier. 1.0 matches most weather markets per
# https://help.kalshi.com/en/articles/13823805-fees.
fee_multiplier = "1.0"
# Max bid-ask spread we'll trade across. Beyond this, round-trip costs eat the edge.
max_spread = "0.10"
# Price band — tail-bracket contracts (cheap or near-1.00) carry asymmetric
# blow-up risk. A $0.05 contract priced at 50% true still needs ~83% true
# hit-rate to clear fees, and one losing tail event wipes out months of
# small wins. Default 0.20–0.92 keeps us out of both ends.
min_price = "0.20"
max_price = "0.92"

[risk]
# Hard caps. v1 is intentionally tiny — directional weather edges are noisy and
# Kalshi liquidity is thin. Bump after a few weeks of profitable paper-trading.
max_position_size_usd = "5.0"
max_total_exposure_usd = "50.0"
# Per-market cooldown after we emit a trade signal. 60s prevents the
# bot thrashing on tiny price wiggles between passes (orderbook moves
# 1¢, model probability barely changes, bot would otherwise re-fire).
per_market_cooldown_secs = 60
max_concurrent_positions = 10
# Notional bankroll the strategy's Kelly fraction sizes against.
# Sized small to match the per-pass cap; bump once paper-trading is clean.
bankroll_usd = "100.0"

[kill_switch]
# Dynamic operator halt — distinct from the executor's static
# `never_send=true` development guard (which requires a code edit). All
# checks fire once at the top of each strategy pass.
enabled = true
# File whose existence (regardless of content) halts new orders.
# Relative to CWD by design — operator-facing, not deploy-baked.
kill_file_path = "./KILL"
# Env var name; non-empty value other than "0"/"false" halts new orders.
kill_env_var = "WEATHER_BOT_KILL"
# Cumulative realised loss (USD) within 24h that flips the soft kill.
# 0 disables — dry-run has no realised P&L, so this is a no-op until
# paper/live trading lands and the bot has a fill ledger to evaluate.
max_drawdown_24h_usd = "0"

[monitor]
poll_interval_ms = 5000
max_concurrent_requests = 5

[logging]
level = "info"
json_output = false
# Per-day JSONL log of every strategy decision (trade or no-trade), one row
# per market per pass. Substrate for backtests + model calibration. Set to
# the empty string or omit the key to disable persistence.
decision_log_dir = "logs/decisions"
